[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialcliff"
version = "0.1.0"
description = "How scene complexity breaks spatial reasoning in an open VLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
gpu = [
    "transformers>=4.49",
    "torch>=2.3",
    "safetensors",
    "accelerate",
]
paper = [
    "matplotlib",
    "markdown",
]
ui = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
